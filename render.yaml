services:
  - type: web
    name: india-regulatory-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        value: https://tzrigywleqfrcsngnkbx.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCRAPE_INTERVAL_SECONDS
        value: "1800"
