services:
  - type: web
    name: india-regulatory-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/regulatory.db
      - key: AI_PROVIDER
        value: none
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SARVAM_MODEL
        value: sarvam-105b
    disk:
      name: regulatory-data
      mountPath: /var/data
      sizeGB: 1
